<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo de Pantalla</title>
    
    <style>
        body {
            /* 1. Aquí pones el enlace de tu imagen */
            background-image: url('https://i.ytimg.com/vi/QAIg_lIkUWI/hqdefault.jpg');

            /* 2. Hace que la imagen cubra todo el espacio sin deformarse */
            background-size: cover;

            /* 3. Centra la imagen para que lo importante quede en medio */
            background-position: center center;

            /* 4. Evita que la imagen se repita como un mosaico */
            background-repeat: no-repeat;

            /* 5. (Opcional) Deja la imagen fija cuando haces scroll hacia abajo */
            background-attachment: fixed;

            /* Asegura que el body ocupe toda la altura de la pantalla */
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>

   

</body>
</html>
