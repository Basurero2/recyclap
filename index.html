<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECICLA'P - Gestión Inteligente de Residuos</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 4px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
</head>

<body class="text-slate-800 antialiased selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- COMPONENTE DE ICONOS SEGURO ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
                    const iconDef = window.lucide.icons[name];
                    const svgElement = window.lucide.createElement(iconDef);
                    svgElement.setAttribute('width', size);
                    svgElement.setAttribute('height', size);
                    svgElement.setAttribute('class', className);
                    svgElement.setAttribute('stroke-width', 2);
                    if (containerRef.current) {
                        containerRef.current.innerHTML = '';
                        containerRef.current.appendChild(svgElement);
                    }
                }
            }, [name, size, className]);

            return <span ref={containerRef} style={{ display: 'inline-flex', alignItems: 'center' }}></span>;
        };

        // --- COMPONENTE MODAL DE VIDEO ---
        const VideoModal = ({ show, onClose, videoSrc }) => {
            if (!show) return null;

            return (
                <div className="fixed inset-0 bg-black bg-opacity-80 z-[100] flex items-center justify-center p-4" onClick={onClose}>
                    <motion.div
                        initial={{ opacity: 0, scale: 0.8 }}
                        animate={{ opacity: 1, scale: 1 }}
                        exit={{ opacity: 0, scale: 0.8 }}
                        className="relative w-full max-w-4xl bg-black rounded-xl shadow-2xl"
                        onClick={e => e.stopPropagation()} // Evitar que el clic en el video cierre el modal
                    >
                        {/* Botón de Cerrar */}
                        <button
                            className="absolute -top-10 right-0 p-2 text-white hover:text-red-400 transition-colors"
                            onClick={onClose}
                            aria-label="Cerrar video"
                        >
                            <Icon name="X" size={32} />
                        </button>

                        {/* Contenedor del Video (Relación de aspecto 16:9) */}
                        <div className="aspect-video">
                            <video
                                src={videoSrc}
                                controls
                                autoPlay
                                className="w-full h-full rounded-xl"
                                onError={(e) => {
                                    e.target.style.backgroundColor = '#1f2937'; // Fondo oscuro si falla
                                    e.target.parentElement.innerHTML = '<p class="text-white p-4 text-center">Error al cargar el video: Asegúrate de que el archivo <strong>video-demo.mp4</strong> esté en la misma carpeta.</p>';
                                }}
                            >
                                Tu navegador no soporta el tag de video.
                            </video>
                        </div>
                    </motion.div>
                </div>
            );
        };

        // --- COMPONENTES UI BÁSICOS ---

        const ImagePlaceholder = ({ label, subtext, height = "min-h-[250px]" }) => (
            <div className={`w-full h-full ${height} bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center p-6 text-center group hover:bg-emerald-50 hover:border-emerald-400 transition-colors cursor-pointer relative overflow-hidden`}>
                <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                <div className="bg-white p-4 rounded-full mb-3 shadow-sm group-hover:scale-110 transition-transform z-10">
                    <Icon name="Image" size={32} className="text-slate-400 group-hover:text-emerald-500" />
                </div>
                <p className="font-bold text-slate-600 text-sm uppercase z-10">{label}</p>
                <p className="text-xs text-slate-400 mt-1 max-w-[200px] z-10">{subtext}</p>
                <div className="mt-4 px-4 py-2 bg-emerald-600 rounded-full text-xs font-bold text-white shadow-lg opacity-0 group-hover:opacity-100 transition-opacity z-10 transform translate-y-2 group-hover:translate-y-0 duration-300">
                    Insertar Imagen
                </div>
            </div>
        );

        const BrowserFrame = ({ children, url, contentClass = "bg-slate-100 min-h-[400px]" }) => (
            <div className="bg-white rounded-xl shadow-2xl overflow-hidden border border-slate-200 transform transition-transform hover:-translate-y-1 duration-500">
                <div className="bg-slate-50 px-4 py-3 border-b border-slate-200 flex items-center gap-4">
                    <div className="flex gap-1.5">
                        <div className="w-3 h-3 rounded-full bg-red-400"></div>
                        <div className="w-3 h-3 rounded-full bg-yellow-400"></div>
                        <div className="w-3 h-3 rounded-full bg-green-400"></div>
                    </div>
                    <div className="flex-1 bg-white border border-slate-200 rounded px-3 py-1 text-xs text-slate-500 flex items-center gap-2 font-mono shadow-sm">
                        <Icon name="Globe" size={12} className="text-emerald-500" />
                        https://{url}
                    </div>
                </div>
                <div className={`relative w-full ${contentClass}`}>
                    {children}
                </div>
            </div>
        );

        const Section = ({ id, className, children }) => (
            <section id={id} className={`py-24 px-6 md:px-12 lg:px-24 overflow-hidden relative ${className}`}>
                {children}
            </section>
        );

        const FadeIn = ({ children, delay = 0, direction = "up" }) => (
            <motion.div
                initial={{ opacity: 0, y: direction === "up" ? 40 : -40 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true, margin: "-50px" }}
                transition={{ duration: 0.7, delay: delay, ease: "easeOut" }}
            >
                {children}
            </motion.div>
        );

        // --- APP PRINCIPAL ---

        function App() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [showDemo, setShowDemo] = useState(false); // Estado para el modal de video

            // URL de la aplicación de usuario
            const APP_URL = "https://recyclap-usuario.vercel.app/index.html";

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen bg-slate-50">

                    {/* MODAL DE VIDEO */}
                    <AnimatePresence>
                        <VideoModal
                            show={showDemo}
                            onClose={() => setShowDemo(false)}
                            videoSrc="video-demo.mp4"
                        />
                    </AnimatePresence>

                    {/* NAVBAR */}
                    <header className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white/90 backdrop-blur-md shadow-lg py-3' : 'bg-transparent py-6'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-2 font-black text-xl tracking-tight text-slate-900">
                                <div className="bg-gradient-to-tr from-emerald-500 to-teal-400 text-white p-2 rounded-lg shadow-emerald-500/30 shadow-lg">
                                    <Icon name="Recycle" size={20} />
                                </div>
                                RECICLA'P
                            </div>

                            <nav className="hidden md:flex gap-8 items-center text-sm font-bold text-slate-600 uppercase tracking-wide">
                                <a href="#lanzamiento" className="hover:text-emerald-600 transition-colors">Lanzamiento</a>
                                <a href="#impacto" className="hover:text-emerald-600 transition-colors">Impacto</a>
                                <a href="#app" className="hover:text-emerald-600 transition-colors">La App</a>
                                <a href="#equipo" className="hover:text-emerald-600 transition-colors">Equipo</a>
                                <a href={APP_URL} target="_blank" rel="noopener noreferrer" className="bg-slate-900 text-white px-6 py-2.5 rounded-full hover:bg-slate-800 transition-all hover:shadow-lg transform hover:-translate-y-0.5">
                                    Web App
                                </a>
                            </nav>

                            <button className="md:hidden" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                <Icon name={isMenuOpen ? "X" : "Menu"} />
                            </button>
                        </div>

                        {/* Menú Móvil */}
                        <AnimatePresence>
                            {isMenuOpen && (
                                <motion.div
                                    initial={{ height: 0, opacity: 0 }}
                                    animate={{ height: "auto", opacity: 1 }}
                                    exit={{ height: 0, opacity: 0 }}
                                    className="md:hidden bg-white border-b absolute w-full top-full left-0 shadow-xl overflow-hidden"
                                >
                                    <div className="flex flex-col p-6 gap-4 font-bold text-slate-700">
                                        <a href="#lanzamiento" onClick={() => setIsMenuOpen(false)}>Lanzamiento</a>
                                        <a href="#impacto" onClick={() => setIsMenuOpen(false)}>Impacto Social</a>
                                        <a href="#app" onClick={() => setIsMenuOpen(false)}>La App</a>
                                        <a href="#equipo" onClick={() => setIsMenuOpen(false)}>Equipo</a>
                                        <a href={APP_URL} target="_blank" rel="noopener noreferrer" className="text-emerald-600">Ir a Web App</a>
                                    </div>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </header>

                    {/* HERO SECTION */}
                    <Section className="pt-32 pb-20 bg-white">
                        <div className="absolute top-0 right-0 w-[600px] h-[600px] bg-emerald-100/50 rounded-full blur-[100px] -translate-y-1/2 translate-x-1/3 z-0"></div>

                        <div className="container mx-auto grid lg:grid-cols-2 gap-12 items-center relative z-10">
                            <FadeIn>
                                <div className="space-y-6">
                                    <div className="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full text-xs font-bold tracking-widest uppercase">
                                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        Web App • 100% Online
                                    </div>
                                    <h1 className="text-5xl md:text-7xl font-black text-slate-900 leading-tight tracking-tight">
                                        Tu basura tiene <br />
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-teal-400">valor real.</span>
                                    </h1>
                                    <p className="text-xl text-slate-500 max-w-lg leading-relaxed">
                                        Únete a la revolución del reciclaje en la UNMSM. Sin descargas: escanea, recicla y gana premios al instante desde tu navegador.
                                    </p>
                                    <div className="flex flex-col sm:flex-row gap-4 pt-4">
                                        {/* BOTÓN "Empezar Ahora" */}
                                        <a href={APP_URL} target="_blank" rel="noopener noreferrer" className="bg-slate-900 text-white px-8 py-4 rounded-full font-bold hover:bg-slate-800 transition-all shadow-xl hover:shadow-2xl flex items-center justify-center gap-2">
                                            Empezar Ahora <Icon name="ArrowRight" size={18} />
                                        </a>
                                        {/* BOTÓN "Ver Demo" - ABRE EL MODAL */}
                                        <button
                                            onClick={() => setShowDemo(true)}
                                            className="bg-white text-slate-700 border-2 border-slate-200 px-8 py-4 rounded-full font-bold hover:border-emerald-400 hover:text-emerald-600 transition-all flex items-center justify-center gap-2"
                                        >
                                            <Icon name="PlayCircle" size={18} /> Ver Demo
                                        </button>
                                    </div>
                                </div>
                            </FadeIn>

                            <FadeIn delay={0.2}>
                                {/* SECCIÓN HERO: IMAGEN DE LOGIN */}
                                <div className="transform rotate-1 hover:rotate-0 transition-transform duration-500">
                                    <BrowserFrame url="app.reciclap.pe/login" contentClass="bg-emerald-500 h-[450px]">
                                        <img
                                            src="image_f25c38.png"
                                            alt="Login Web App RECICLA'P"
                                            className="w-full h-full object-cover"
                                            onError={(e) => {
                                                e.target.onerror = null;
                                                e.target.parentElement.innerHTML = '<div class="w-full h-full flex items-center justify-center bg-slate-200 text-slate-500 text-center p-4 min-h-[400px]">Imagen no encontrada.<br/>Asegúrate de que el archivo se llame <strong>image_f25c38.png</strong></div>'
                                            }}
                                        />
                                    </BrowserFrame>
                                </div>
                            </FadeIn>
                        </div>
                    </Section>

                    {/* LANZAMIENTO UNMSM */}
                    <Section id="lanzamiento" className="bg-slate-900 text-white relative overflow-hidden">
                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10"></div>
                        <div className="absolute top-0 left-0 w-96 h-96 bg-blue-600 rounded-full blur-[120px] opacity-30"></div>
                        <div className="absolute bottom-0 right-0 w-96 h-96 bg-emerald-600 rounded-full blur-[120px] opacity-30"></div>

                        <div className="relative z-10 container mx-auto text-center">
                            <FadeIn>
                                <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur border border-white/10 px-4 py-2 rounded-full mb-8">
                                    <Icon name="MapPin" className="text-emerald-400" size={16} />
                                    <span className="text-sm font-bold tracking-wider uppercase">Piloto Oficial 2025</span>
                                </div>
                                <h2 className="text-4xl md:text-5xl font-black mb-6">Universidad Nacional Mayor de San Marcos</h2>
                                <p className="text-xl text-slate-300 max-w-2xl mx-auto mb-12">
                                    La Decana de América lidera el cambio. La Facultad de Ingeniería de Sistemas e Informática (FISI) será el primer campus inteligente.
                                </p>
                            </FadeIn>

                            <div className="grid md:grid-cols-3 gap-6 max-w-5xl mx-auto">
                                {[
                                    { icon: "School", title: "Ubicación", desc: "Pabellón Principal FISI, 1er Piso" },
                                    { icon: "Users", title: "Beneficiarios", desc: "+2,000 Estudiantes y Docentes" },
                                    { icon: "Leaf", title: "Meta Inicial", desc: "500kg de Plástico/Mes" }
                                ].map((item, i) => (
                                    <FadeIn key={i} delay={i * 0.1}>
                                        <div className="bg-white/5 backdrop-blur-md border border-white/10 p-6 rounded-2xl hover:bg-white/10 transition-colors">
                                            <div className="w-12 h-12 bg-emerald-500/20 rounded-xl flex items-center justify-center mx-auto mb-4 text-emerald-400">
                                                <Icon name={item.icon} size={24} />
                                            </div>
                                            <h3 className="font-bold text-lg mb-1">{item.title}</h3>
                                            <p className="text-sm text-slate-400">{item.desc}</p>
                                        </div>
                                    </FadeIn>
                                ))}
                            </div>
                        </div>
                    </Section>

                    {/* IMPACTO SOCIAL */}
                    <Section id="impacto" className="bg-emerald-50">
                        <div className="container mx-auto">
                            <div className="text-center max-w-3xl mx-auto mb-16">
                                <span className="text-emerald-600 font-bold tracking-widest uppercase text-sm">Más allá de la tecnología</span>
                                <h2 className="text-3xl md:text-5xl font-black text-slate-900 mt-2 mb-6">Un impacto real en nuestra sociedad</h2>
                                <p className="text-lg text-slate-600">
                                    RECICLA'P no es solo una app, es una herramienta para construir ciudades sostenibles y ciudadanos conscientes.
                                </p>
                            </div>

                            <div className="grid md:grid-cols-2 gap-12 items-center">
                                <FadeIn>
                                    <div className="space-y-8">
                                        <div className="flex gap-5">
                                            <div className="w-14 h-14 rounded-2xl bg-white shadow-md flex items-center justify-center text-emerald-600 flex-shrink-0">
                                                <Icon name="Sprout" size={28} />
                                            </div>
                                            <div>
                                                <h3 className="text-xl font-bold text-slate-900">Cultura Verde</h3>
                                                <p className="text-slate-500 mt-2">
                                                    Transformamos el reciclaje de una "obligación" a un hábito positivo y recompensado mediante la gamificación.
                                                </p>
                                            </div>
                                        </div>
                                        <div className="flex gap-5">
                                            <div className="w-14 h-14 rounded-2xl bg-white shadow-md flex items-center justify-center text-blue-600 flex-shrink-0">
                                                <Icon name="RefreshCw" size={28} />
                                            </div>
                                            <div>
                                                <h3 className="text-xl font-bold text-slate-900">Economía Circular</h3>
                                                <p className="text-slate-500 mt-2">
                                                    Reconectamos los residuos con la cadena de valor, asegurando que las botellas vuelvan a ser botellas.
                                                </p>
                                            </div>
                                        </div>
                                        <div className="flex gap-5">
                                            <div className="w-14 h-14 rounded-2xl bg-white shadow-md flex items-center justify-center text-orange-600 flex-shrink-0">
                                                <Icon name="HeartHandshake" size={28} />
                                            </div>
                                            <div>
                                                <h3 className="text-xl font-bold text-slate-900">Apoyo Local</h3>
                                                <p className="text-slate-500 mt-2">
                                                    Nuestras recompensas impulsan los negocios locales (cafeterías, librerías) dentro y fuera del campus.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </FadeIn>

                                <FadeIn delay={0.3}>
                                    <div className="bg-white p-4 rounded-3xl shadow-xl border border-slate-100 rotate-2 hover:rotate-0 transition-transform duration-500">
                                        {/* IMAGEN DE IMPACTO */}
                                        <img
                                            src="image_f1dc35.png"
                                            alt="Impacto Social RECICLA'P"
                                            className="w-full h-full object-cover rounded-2xl"
                                            onError={(e) => {
                                                e.target.onerror = null;
                                                e.target.parentElement.innerHTML = '<div class="w-full h-full flex items-center justify-center bg-slate-200 text-slate-500 text-center p-4">Imagen no encontrada.<br/>Asegúrate de que el archivo se llame <strong>image_f1dc35.png</strong></div>'
                                            }}
                                        />
                                    </div>
                                </FadeIn>
                            </div>
                        </div>
                    </Section>

                    {/* APP SHOWCASE */}
                    <Section id="app" className="bg-white">
                        <div className="container mx-auto grid lg:grid-cols-2 gap-16 items-center">
                            <FadeIn className="order-2 lg:order-1">
                                {/* SECCIÓN APP: IMAGEN DASHBOARD RECOMPENSAS */}
                                <BrowserFrame url="app.reciclap.pe/dashboard" contentClass="bg-slate-50 h-[450px]">
                                    <img
                                        src="image_f25192.png"
                                        alt="Dashboard Recompensas RECICLA'P"
                                        className="w-full h-full object-cover"
                                        onError={(e) => {
                                            e.target.onerror = null;
                                            e.target.parentElement.innerHTML = '<div class="w-full h-full flex items-center justify-center bg-slate-200 text-slate-500 text-center p-4">Imagen no encontrada.<br/>Asegúrate de que el archivo se llame <strong>image_f25192.png</strong></div>'
                                        }}
                                    />
                                </BrowserFrame>
                            </FadeIn>

                            <div className="order-1 lg:order-2">
                                <FadeIn>
                                    <h2 className="text-3xl md:text-5xl font-black text-slate-900 mb-6">Control total en tus manos</h2>
                                    <p className="text-lg text-slate-500 mb-8">
                                        Nuestra Web App está diseñada para ser rápida y fácil. Mira lo que puedes hacer:
                                    </p>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                            <Icon name="QrCode" className="text-emerald-500 mb-2" />
                                            <h4 className="font-bold">Escaneo Rápido</h4>
                                            <p className="text-xs text-slate-500">Detecta el tacho al instante.</p>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                            <Icon name="Gift" className="text-purple-500 mb-2" />
                                            <h4 className="font-bold">Canje Directo</h4>
                                            <p className="text-xs text-slate-500">Cupones digitales inmediatos.</p>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                            <Icon name="History" className="text-blue-500 mb-2" />
                                            <h4 className="font-bold">Historial</h4>
                                            <p className="text-xs text-slate-500">Traza cada botella reciclada.</p>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                            <Icon name="Lock" className="text-orange-500 mb-2" />
                                            <h4 className="font-bold">Seguridad</h4>
                                            <p className="text-xs text-slate-500">Datos en LocalStorage.</p>
                                        </div>
                                    </div>
                                </FadeIn>
                            </div>
                        </div>
                    </Section>

                    {/* EQUIPO */}
                    <Section id="equipo" className="bg-slate-50 relative">
                        <div className="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                        <div className="container mx-auto relative z-10">
                            <div className="text-center mb-16">
                                <h2 className="text-4xl font-black text-slate-900">Equipo Fundador</h2>
                                <p className="text-slate-500 mt-2">Mentes jóvenes de la UNMSM impulsando el cambio tecnológico.</p>
                            </div>

                            <div className="grid md:grid-cols-4 gap-6 mb-16">
                                {/* MIEMBRO 1 (MAYHUA QUISPE - FOTO) */}
                                <FadeIn key={0} delay={0.1}>
                                    <div className="glass-card p-6 rounded-2xl text-center group hover:-translate-y-2 transition-transform duration-300">
                                        <div className="relative mx-auto w-24 h-24 mb-4">
                                            <div className="absolute inset-0 rounded-full opacity-20 blur-lg bg-blue-500"></div>
                                            <div className="relative w-full h-full rounded-full overflow-hidden border-2 border-white shadow-md bg-white">
                                                <img
                                                    src="image_f0fb77.png"
                                                    alt="Mayhua Quispe"
                                                    className="w-full h-full object-cover"
                                                    onError={(e) => {
                                                        e.target.onerror = null;
                                                        e.target.parentElement.innerHTML = '<div class="w-full h-full flex items-center justify-center bg-slate-200 text-xs text-slate-500">Sin foto</div>'
                                                    }}
                                                />
                                            </div>
                                        </div>
                                        <h3 className="font-bold text-lg text-slate-900">Mayhua Quispe</h3>
                                        <p className="text-xs font-bold text-emerald-600 uppercase tracking-wider mt-1 mb-3">CEO & Estrategia</p>
                                    </div>
                                </FadeIn>

                                {/* MIEMBRO 2 (MAMANI APAZA - FOTO) */}
                                <FadeIn key={1} delay={0.2}>
